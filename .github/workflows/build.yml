name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン (例: 0.1.0)。空ならビルドのみ。main ではタグと GitHub リリースも作り、dev では Google Play にだけ送る（同じバージョンで何度でもテストに出せる）'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # 既定の Enhanced Caching はプロプライエタリ（Gradle Technologies Terms of Use）のため MIT 版を使う
          cache-provider: basic

      - name: Check release notes
        run: scripts/play.sh check whatsnew

      - name: Check release ref
        if: inputs.version != ''
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/heads/dev) ;;
            *) echo "::error::リリースは main（正式リリース）か dev（Play のテスト）からのみ実行できます"; exit 1 ;;
          esac

      # 署名鍵はリリースのときだけ使う。PR と push はデバッグ鍵で署名する
      - name: Decode keystore
        if: inputs.version != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 が未設定のためデバッグ鍵で署名します"
          fi

      - name: Build
        id: build
        env:
          SIGNING_STORE_PASSWORD: ${{ inputs.version != '' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ inputs.version != '' && secrets.SIGNING_KEY_PASSWORD || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::不正なバージョン: $INPUT_VERSION"; exit 1; }
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./gradlew assembleRelease bundleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          APK="mqr-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp app/build/outputs/bundle/release/app-release.aab "mqr-$VERSION.aab"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "### $APK: $(stat -c %s "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: aab
          path: mqr-${{ env.VERSION }}.aab

  release:
    # main からの実行だけタグと GitHub リリースを作る。書き込み権限はこのジョブだけに付ける
    needs: build
    if: inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          APK="mqr-$VERSION.apk"
          # whatsnew のリリースノートを自動生成ノートの前に置く
          scripts/play.sh notes whatsnew > "$RUNNER_TEMP/notes.md"
          # このコミットにタグ v<version> を作成してリリースする
          gh release create "v$VERSION" "$APK" "$APK.sha256" THIRD_PARTY_NOTICES.md --target "$GITHUB_SHA" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"

  play:
    # 手動リリース時、Google Play の設定 (Variables) があるときだけ実行する
    needs: build
    if: inputs.version != '' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read
      id-token: write # Workload Identity Federation 用
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: aab

      - name: Upload to Google Play
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          PACKAGE_NAME: io.github.diontools.mqr
          VERSION_NAME: ${{ inputs.version }}
        run: scripts/play.sh upload whatsnew mqr-*.aab
